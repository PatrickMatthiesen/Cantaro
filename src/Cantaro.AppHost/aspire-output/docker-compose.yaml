services:
  docker-compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "cantaro-postgres-data"
        read_only: false
    networks:
      - "aspire"
  garage:
    image: "dxflrs/garage@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690"
    command:
      - "/garage"
      - "server"
    environment:
      GARAGE_CONFIG_FILE: "/etc/garage.toml"
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN}"
    expose:
      - "3900"
      - "3903"
      - "3901"
    volumes:
      - type: "volume"
        target: "/var/lib/garage"
        source: "cantaro-garage-data"
        read_only: false
    networks:
      - "aspire"
    configs:
      - source: "garage__etc_garage.toml"
        target: "/etc/garage.toml"
        mode: 0644
  garage-provisioner:
    image: "${GARAGE_PROVISIONER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__garage: "AdminUrl=http://garage:3903;AdminToken=${GARAGE_ADMIN_TOKEN}"
      ConnectionStrings__avatars: "ServiceUrl=http://garage:3900;AccessKeyId=${GARAGE_ACCESS_KEY_ID};SecretAccessKey=${GARAGE_SECRET_ACCESS_KEY};Region=garage;ForcePathStyle=true;BucketName=cantaro-avatars"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "garage-provisioner"
    depends_on:
      garage:
        condition: "service_started"
    networks:
      - "aspire"
  migration-service:
    image: "${MIGRATION_SERVICE_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__cantaro-db: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=cantaro-db"
      CANTARO_DB_HOST: "postgres"
      CANTARO_DB_PORT: "5432"
      CANTARO_DB_USERNAME: "postgres"
      CANTARO_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      CANTARO_DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cantaro-db"
      CANTARO_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/cantaro-db"
      CANTARO_DB_DATABASENAME: "cantaro-db"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "migration-service"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      YouTube:ClientId: "${YOUTUBECLIENTID}"
      YouTube:ClientSecret: "${YOUTUBECLIENTSECRET}"
      Spotify:ClientId: "${SPOTIFYCLIENTID}"
      Spotify:ClientSecret: "${SPOTIFYCLIENTSECRET}"
      AniList:ClientId: "${ANILISTCLIENTID}"
      AniList:ClientSecret: "${ANILISTCLIENTSECRET}"
      ExtensionAuth:JwtSigningKey: "${EXTENSIONAUTHJWTSIGNINGKEY}"
      Frontend:HttpsBaseUrl: "${FRONTENDHTTPSBASEURL}"
      Frontend:TrustedOrigins:0: "${FRONTENDHTTPSBASEURL}"
      ConnectionStrings__cantaro-db: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=cantaro-db"
      CANTARO_DB_HOST: "postgres"
      CANTARO_DB_PORT: "5432"
      CANTARO_DB_USERNAME: "postgres"
      CANTARO_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      CANTARO_DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cantaro-db"
      CANTARO_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/cantaro-db"
      CANTARO_DB_DATABASENAME: "cantaro-db"
      ConnectionStrings__avatars: "ServiceUrl=http://garage:3900;AccessKeyId=${GARAGE_ACCESS_KEY_ID};SecretAccessKey=${GARAGE_SECRET_ACCESS_KEY};Region=garage;ForcePathStyle=true;BucketName=cantaro-avatars"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    ports:
      - "${API_PORT}"
      - "7689:${API_PORT}"
    depends_on:
      migration-service:
        condition: "service_completed_successfully"
      garage-provisioner:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
volumes:
  cantaro-postgres-data:
    driver: "local"
  cantaro-garage-data:
    driver: "local"
configs:
  garage__etc_garage.toml:
    content: "# Single-node development topology: replication_factor=1 provides no redundancy.\r\nmetadata_dir = \"/var/lib/garage/meta\"\r\ndata_dir = \"/var/lib/garage/data\"\r\ndb_engine = \"sqlite\"\r\nreplication_factor = 1\r\n\r\nrpc_bind_addr = \"[::]:3901\"\r\n\r\n[s3_api]\r\ns3_region = \"garage\"\r\napi_bind_addr = \"0.0.0.0:3900\"\r\nroot_domain = \".s3.garage.local\"\r\n\r\n[admin]\r\napi_bind_addr = \"0.0.0.0:3903\"\r\n"
