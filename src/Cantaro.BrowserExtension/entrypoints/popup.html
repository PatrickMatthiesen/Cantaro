<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantaro - Settings</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #333;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #555;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4285f4;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #3367d6;
    }
    button:active {
      background-color: #2851a3;
    }
    .status {
      padding: 8px;
      border-radius: 4px;
      margin-top: 16px;
      font-size: 14px;
    }
    .status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Cantaro Settings</h1>
  
  <form id="settingsForm">
    <div class="form-group">
      <label for="apiBaseUrl">API Base URL</label>
      <input 
        type="url" 
        id="apiBaseUrl" 
        placeholder="http://localhost:5000" 
        required
      />
      <div class="info">The URL of your Cantaro API instance</div>
    </div>

    <div class="form-group">
      <label for="authToken">Authentication Token (Optional)</label>
      <input 
        type="password" 
        id="authToken" 
        placeholder="Your Cantaro auth token"
      />
      <div class="info">Get this from the Cantaro web app after logging in</div>
    </div>

    <button type="submit">Save Settings</button>
  </form>

  <div id="status" style="display: none;"></div>

  <script src="../components/popup.ts" type="module"></script>
</body>
</html>
