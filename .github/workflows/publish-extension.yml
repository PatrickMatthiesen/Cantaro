name: Publish Extension

on:
    workflow_dispatch:
        inputs:
            publish_extensions:
                description: "Publish extensions to web stores (Chrome/Firefox)"
                type: boolean
                default: false
            create_tag:
                description: "Create an extension version tag after successful publish"
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    build-extension:
        name: Build Extension Artifacts
        runs-on: ubuntu-latest
        environment: "Production"
        outputs:
            version: ${{ steps.version.outputs.version }}
            chrome_zip: ${{ steps.zip.outputs.chrome_zip }}
            firefox_zip: ${{ steps.zip.outputs.firefox_zip }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.3

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Extract extension version
              id: version
              run: |
                  VERSION=$(node -p "require('./src/Cantaro.BrowserExtension/package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Extension version: $VERSION"

            - name: Validate version consistency
              run: |
                  PKG_VERSION=$(node -p "require('./src/Cantaro.BrowserExtension/package.json').version")
                  WXT_VERSION=$(grep -oP "version:\s*'\K[^']+" src/Cantaro.BrowserExtension/wxt.config.ts)
                  MANIFEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src/Cantaro.BrowserExtension/.output/chrome-mv3/manifest.json','utf8')).version")

                  if [ "$PKG_VERSION" != "$WXT_VERSION" ]; then
                      echo "::error::Version mismatch: package.json=$PKG_VERSION wxt.config.ts=$WXT_VERSION"
                      exit 1
                  fi
                  if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
                      echo "::error::Version mismatch: package.json=$PKG_VERSION manifest.json=$MANIFEST_VERSION"
                      exit 1
                  fi
                  echo "All versions match: $PKG_VERSION"

            - name: Build extension (Chrome)
              working-directory: src/Cantaro.BrowserExtension
              run: bun run build
              env:
                  WEB_HTTP: "${{ secrets.CANTARO_HTTPS_BASE_URL }}"

            - name: Build extension (Firefox)
              working-directory: src/Cantaro.BrowserExtension
              run: bun run build:firefox
              env:
                  WEB_HTTP: "${{ secrets.CANTARO_HTTPS_BASE_URL }}"

            - name: Create Chrome ZIP
              id: zip
              run: |
                  bun run zip
                  echo "chrome_zip=.output/chrome.zip" >> "$GITHUB_OUTPUT"

            - name: Create Firefox ZIP
              run: bun run zip:firefox
              working-directory: src/Cantaro.BrowserExtension

            - name: Upload Chrome artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cantaro-extension-chrome-${{ steps.version.outputs.version }}
                  path: src/Cantaro.BrowserExtension/.output/chrome.zip
                  retention-days: 30

            - name: Upload Firefox artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cantaro-extension-firefox-${{ steps.version.outputs.version }}
                  path: src/Cantaro.BrowserExtension/.output/firefox.zip
                  retention-days: 30

    submit-stores:
        name: Submit to Chrome & Firefox
        runs-on: ubuntu-latest
        needs: build-extension
        if: ${{ github.event.inputs.publish_extensions == 'true' }}
        environment: "Production"
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.3

            - name: Download Chrome artifact
              uses: actions/download-artifact@v4
              with:
                  name: cantaro-extension-chrome-${{ needs.build-extension.outputs.version }}
                  path: .output
              continue-on-error: true

            - name: Download Firefox artifact
              uses: actions/download-artifact@v4
              with:
                  name: cantaro-extension-firefox-${{ needs.build-extension.outputs.version }}
                  path: .output/firefox
              continue-on-error: true

            - name: Setup Node for WXT CLI
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Submit to Chrome & Firefox (staged/unlisted)
              working-directory: src/Cantaro.BrowserExtension
              run: wxt submit --chrome-zip ../cantaro-extension-chrome-${{ needs.build-extension.outputs.version }}/chrome.zip --firefox-zip ../cantaro-extension-firefox-${{ needs.build-extension.outputs.version }}/firefox.zip --firefox-sources-zip ../cantaro-extension-firefox-${{ needs.build-extension.outputs.version }}/sources.zip
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

            - name: Create extension version tag
              if: ${{ github.event.inputs.create_tag == 'true' && success() }}
              working-directory: src/Cantaro.BrowserExtension
              run: |
                  TAG="extension/v${{ needs.build-extension.outputs.version }}"
                  EXISTING_SHA=$(git rev-parse "$TAG" 2>/dev/null || echo "")
                  if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "${{ github.sha }}" ]; then
                      echo "::error::Tag $TAG already exists but points to a different commit ($EXISTING_SHA). Refusing to overwrite."
                      exit 1
                  elif [ -z "$EXISTING_SHA" ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git tag -a "$TAG" -m "Extension version ${{ needs.build-extension.outputs.version }} submitted to Chrome/Firefox"
                      git push origin "$TAG" || echo "::warning::Could not push tag (permissions or remote may be missing)."
                  else
                      echo "Tag $TAG already exists and points to this commit. Skipping."
                  fi
                      git push origin "$TAG"
                      echo "Created and pushed tag $TAG"
                  fi
