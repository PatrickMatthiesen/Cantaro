name: Deploy Cantaro

on:
  workflow_dispatch:
    inputs:
      publish_extensions:
        description: "Build extension artifacts and publish configured stores after deployment"
        type: boolean
        default: false
      create_extension_tag:
        description: "Create an immutable extension version tag after successful store submission"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-cantaro
  cancel-in-progress: false

jobs:
  verify-ref:
    name: Verify deployment ref
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployments must run from main, not $RELEASE_REF."
            exit 1
          fi

  deploy:
    name: Publish and deploy
    needs: verify-ref
    runs-on: ubuntu-latest
    environment:
      name: "Production"
    env:
      DOCKER_CONTEXT_NAME: docker-host-${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --quality "dev"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          dotnet restore
          bun install --frozen-lockfile

      - name: Publish Docker Compose artifacts
        run: |
          aspire publish --output-path ./aspire-output --non-interactive

      - name: Upload Aspire publish output
        uses: actions/upload-artifact@v4
        with:
          name: cantaro-aspire-output
          path: ./aspire-output/
          retention-days: 14
          include-hidden-files: true

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: "true"
          version: latest
          ping: ${{ secrets.SSH_HOST }}

      - name: Add SSH host key
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with Aspire through Docker context
        env:
          ASPIRE_CONTAINER_RUNTIME: docker
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          Parameters__GoogleClientId: ${{ secrets.CANTARO_GOOGLE_CLIENT_ID }}
          Parameters__GoogleClientSecret: ${{ secrets.CANTARO_GOOGLE_CLIENT_SECRET }}
          Parameters__SpotifyClientId: ${{ secrets.CANTARO_SPOTIFY_CLIENT_ID }}
          Parameters__SpotifyClientSecret: ${{ secrets.CANTARO_SPOTIFY_CLIENT_SECRET }}
          Parameters__FrontendHttpsBaseUrl: ${{ vars.CANTARO_HTTPS_BASE_URL }}
          Parameters__AniListClientId: ${{ secrets.CANTARO_ANILIST_CLIENT_ID }}
          Parameters__AniListClientSecret: ${{ secrets.CANTARO_ANILIST_CLIENT_SECRET }}
          Parameters__MyAnimeListClientId: ${{ secrets.CANTARO_MYANIMELIST_CLIENT_ID }}
          Parameters__MyAnimeListClientSecret: ${{ secrets.CANTARO_MYANIMELIST_CLIENT_SECRET }}
          Parameters__AnimeScheduleId: ${{ secrets.CANTARO_ANIMESCHEDULE_ID }}
          Parameters__AnimeScheduleToken: ${{ secrets.CANTARO_ANIMESCHEDULE_TOKEN }}
          Parameters__TurnstileMode: ${{ vars.CANTARO_TURNSTILE_MODE || 'Auto' }}
          Parameters__TurnstileSiteKey: ${{ vars.CANTARO_TURNSTILE_SITE_KEY }}
          Parameters__TurnstileSecret: ${{ secrets.CANTARO_TURNSTILE_SECRET }}
          Parameters__TurnstileHostname: ${{ vars.CANTARO_TURNSTILE_HOSTNAME }}
          Parameters__AuthenticationMode: ${{ vars.CANTARO_AUTHENTICATION_MODE || 'Local' }}
          Parameters__TrustedProxyIp: ${{ secrets.CANTARO_TRUSTED_PROXY_IP }}
          Parameters__ExtensionAuthJwtSigningKey: ${{ secrets.CANTARO_EXTENSION_AUTH_JWT_SIGNING_KEY }}
          Parameters__postgres_password: ${{ secrets.CANTARO_POSTGRES_PASSWORD }}
        run: |
          docker context create "$DOCKER_CONTEXT_NAME" --docker "host=ssh://$DEPLOY_USER@$DEPLOY_HOST"
          docker context use "$DOCKER_CONTEXT_NAME"
          aspire deploy --environment Production --non-interactive

      - name: Verify remote containers
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker ps --filter label=com.docker.compose.project=cantaro --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"

      - name: Remove temporary Docker context
        if: always()
        run: |
          docker context use default
          docker context rm "$DOCKER_CONTEXT_NAME" || true

  extension-release:
    name: Build and optionally publish extensions
    needs: deploy
    uses: ./.github/workflows/publish-extension.yml
    with:
      publish_extensions: ${{ inputs.publish_extensions }}
      create_tag: ${{ inputs.create_extension_tag }}
    secrets: inherit
    permissions:
      contents: write
