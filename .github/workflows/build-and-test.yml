name: Build and test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      extension: ${{ steps.filter.outputs.extension }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - '.github/workflows/**'
              - '.github/workflows/music-relation-benchmarks.yml'
              - 'Cantaro.slnx'
              - 'NuGet.config'
              - 'dotnet-tools.json'
              - 'benchmarks/**/*.cs'
              - 'benchmarks/**/*.csproj'
              - 'src/**/*.cs'
              - 'src/**/*.csproj'
              - 'tests/**/*.cs'
              - 'tests/**/*.csproj'
            frontend:
              - '.github/workflows/**'
              - 'package.json'
              - 'bun.lock'
              - 'src/Cantaro.ClientShared/**'
              - 'src/Cantaro.Web/**'
            extension:
              - '.github/workflows/**'
              - '.github/workflows/publish-extension.yml'
              - 'scripts/extension-release.test.ts'
              - 'package.json'
              - 'bun.lock'
              - 'src/Cantaro.ClientShared/**'
              - 'src/Cantaro.BrowserExtension/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: cantaro_test
          POSTGRES_PASSWORD: cantaro-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantaro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CANTARO_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=cantaro_test;Username=postgres;Password=cantaro-ci-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:AspireUseCliBundle=false

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check shared package
        run: bun run check:shared

      - name: Lint frontend
        run: cd src/Cantaro.Web && bun run lint

      - name: Audit authored CSS
        run: bun run check:css

      - name: Build Frontend
        run: bun run build:web

  extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.extension == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check shared package
        run: bun run check:shared

      - name: Audit authored CSS
        run: bun run check:css

      - name: Check extension
        run: bun run check:extension

      - name: Test extension release workflow
        run: bun run test:extension-release

  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend, extension]
    if: always()
    steps:
      - name: Require successful applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '.changes.result == "success" and ([.backend.result, .frontend.result, .extension.result] | all(. == "success" or . == "skipped"))'
